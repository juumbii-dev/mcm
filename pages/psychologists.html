<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Зөвлөхүүд | MindConnect Mongolia</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="../index.html">
          <span class="brand-mark">M</span>
          <span>MindConnect Mongolia</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </button>
        <nav class="site-nav">
          <a href="../index.html">Нүүр хуудас</a>
          <a href="psychologists.html">Зөвлөхүүд</a>
          <a href="../index.html#faq">FAQ</a>
          <a href="../index.html#contact">Холбоо барих</a>
          <a href="login.html" class="nav-cta">Нэвтрэх</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="page-hero">
        <p class="eyebrow">MVP</p>
        <h1 class="page-title">Зөвлөхүүдийн жагсаалт</h1>
        <p class="page-subtitle">Чиглэл, хот, үнэ, үнэлгээний дагуу шүүлтүүр хийж, цаг захиалан шийдлээ.</p>
      </section>

      <section class="filter-bar">
        <div class="filter-group">
          <select>
            <option>Бүх чиглэл</option>
            <option>Стресс</option>
            <option>Хосуудын харилцаа</option>
            <option>Хүүхэд</option>
          </select>
          <select>
            <option>Бүх хот</option>
            <option>Улаанбаатар</option>
            <option>Дархан</option>
            <option>Эрдэнэт</option>
          </select>
        </div>
        <a class="btn btn-primary" href="register.html">Бүртгүүлэх</a>
      </section>

      <section id="psychologist-list" class="cards-grid">
        <!-- Populated dynamically by script.js. When a counselor is logged in,
             only their associated counselor card will be shown and parent page
             elements (hero/filter) will be hidden. -->
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© 2026 MindConnect Mongolia</p>
      </div>
    </footer>

    <script src="../script.js"></script>
  </body>
</html>
