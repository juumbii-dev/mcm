<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Зөвлөх нэвтрэх | MindConnect Mongolia</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="../index.html">
          <span class="brand-mark">M</span>
          <span>MindConnect Mongolia</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </button>
        <nav class="site-nav">
          <a href="../index.html">Нүүр хуудас</a>
          <a href="psychologists.html">Зөвлөхүүд</a>
          <a href="../index.html#faq">FAQ</a>
          <a href="../index.html#contact">Холбоо барих</a>
          <a href="login.html" class="nav-cta">Нэвтрэх</a>
        </nav>
      </div>
    </header>

    <main class="container" style="padding: 3rem 0;">
      <section class="form-card">
        <p class="eyebrow">Зөвлөх бүртгэл</p>
        <h1 class="page-title">Зөвлөх болгон бүртгүүлэх</h1>
          <p class="page-subtitle">Имэйл болон нууц үгээ оруулж бүртгүүлнэ үү.</p>

        <form id="register-form">
          <!-- server requires `name`, so provide default counselor name -->
          <input type="hidden" name="name" value="Зөвлөх" />
          <input type="hidden" name="role" value="counselor" />
          <label>
            Зөвлөхийн профайл
            <select name="psychologistId" required>
              <option value="">Зөвлөх сонго</option>
              <option value="1">А. Мягмар</option>
              <option value="2">Б. Нандин</option>
              <option value="3">Г. Төгс</option>
            </select>
          </label>
          <input type="email" name="email" placeholder="Имэйл" required />
          <input type="password" name="password" placeholder="Нууц үг" required />
          <button class="btn btn-primary" type="submit">Бүртгүүлэх</button>
        </form>

        <hr style="margin: 1.5rem 0;" />

        <p class="eyebrow">Зөвлөх нэвтрэх</p>
        <form id="login-form">
          <input type="email" name="email" placeholder="Имэйл" required />
          <input type="password" name="password" placeholder="Нууц үг" required />
          <button class="btn btn-primary" type="submit">Нэвтрэх</button>
        </form>

      </section>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
