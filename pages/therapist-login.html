<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Зөвлөхийн нэвтрэх хэсэг | MindConnect</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="container" style="padding: 4rem 0">
      <section class="form-card">
        <p class="eyebrow">ЗӨВЛӨХИЙН ХЭСЭГ</p>
        <h1 class="page-title">Профайлдаа нэвтрэх</h1>
        <p class="page-subtitle">Хүсэлт баталгаажсан зөвлөхүүд энд нэвтэрнэ.</p>
        <form id="login-form">
          <label>Имэйл<input type="email" name="email" required autocomplete="email" /></label>
          <label>Нууц үг<input type="password" name="password" required autocomplete="current-password" /></label>
          <button class="btn btn-primary" type="submit">Нэвтрэх</button>
        </form>
        <p class="form-link">Зөвлөх биш үү? <a href="therapist-signup.html">Бүртгүүлэх</a></p>
      </section>
    </main>
    <script src="../script.js"></script>
  </body>
</html>
